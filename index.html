<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The config contains secrets: forbid any network requests from scripts. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
  <title>INSYS Forge</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        const stored = localStorage.getItem('forge-theme');
        if (stored === 'dark' || stored === 'light') document.documentElement.dataset.theme = stored;
      } catch (e) { /* localStorage unavailable (e.g. private mode) */ }
    })();
  </script>
</head>
<body>
  <nav class="rail" aria-label="Main navigation">
    <button class="rail-logo" type="button" data-action="open-file" title="Open config file" aria-label="Open config file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </button>
    <div id="nav" class="rail-items"></div>
    <button id="theme-toggle" class="rail-theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
      </svg>
    </button>
  </nav>

  <div class="shell">
    <header class="topbar">
      <h1 id="topbar-title" class="topbar-title">INSYS Forge</h1>
      <div id="topbar-meta" class="topbar-meta"></div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div class="drop-overlay" aria-hidden="true"><span>Drop config file to open</span></div>
  <input id="file-input" type="file" accept=".txt,.cfg,.conf,text/plain" hidden>

  <script src="js/parser.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <!-- Views: each script registers one navigation entry, in this order. -->
  <script src="js/views/dashboard.js"></script>
  <script>Forge.start();</script>
</body>
</html>
